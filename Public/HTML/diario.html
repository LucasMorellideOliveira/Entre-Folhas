<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:ital,wght@0,600;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../CSS/diario.css">
    <link rel="icon" type="image/png" href="../imagens/logo-sol-no-livro.png">
    <title>Meu diário | Entre Folhas</title>
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <a href="diario.html">
                <img src="../imagens/logo-sol-no-livro.png" alt="Logo: livro aberto com um sol">
                <span>Entre Folhas</span>
            </a>
        </div>
        <ul class="nav-links">
            <li><a class="link-ativo" href="diario.html">Meu diário</a></li>
            <li><a href="registro.html">Novo registro</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
        <div class="nav-usuario">
            <span>Olá, <strong id="nome_usuario">Lucas</strong></span>
            <a class="nav-botoes" onclick="Sair()">Sair</a>
        </div>
    </header>

    <section class="pagina">
        <div class="pagina-topo">
            <div class="pagina-titulo">
                <h1>Meu diário</h1>
                <p>Os seus momentos na natureza, do mais recente para o mais antigo.</p>
            </div>
            <a class="botao-principal" href="registro.html">+ Novo registro</a>
        </div>

        <div class="filtros">
            <button class="botao-filtro filtro-ativo" onclick="filtrar(0, this)">Todos</button>
            <button class="botao-filtro" onclick="filtrar(1, this)">Fauna</button>
            <button class="botao-filtro" onclick="filtrar(2, this)">Flora</button>
            <button class="botao-filtro" onclick="filtrar(3, this)">Paisagem</button>
            <button class="botao-filtro" onclick="filtrar(4, this)">Clima</button>
            <button class="botao-filtro" onclick="filtrar(5, this)">Água</button>
        </div>

        <div class="diario-vazio" id="diario_vazio">
            <h2 id="titulo_vazio">Nenhuma postagem feita ainda</h2>
            <p id="texto_vazio">Que tal guardar o seu primeiro momento na natureza?</p>
            <a class="botao-principal" href="registro.html">Criar meu primeiro registro</a>
        </div>

        <div class="grade-registros" id="lista_registros"></div>
    </section>
</body>

</html>
<script>
    if (sessionStorage.ID_USUARIO == undefined) {
        window.location.href = "login.html"
    }

    nome_usuario.innerHTML = sessionStorage.NOME_USUARIO

    function Sair() {
        sessionStorage.clear()
        window.location.href = "../index.html"
    }

    function listarRegistros() {
        fetch(`/registros/listar/${sessionStorage.ID_USUARIO}`)
            .then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (registros) {
                        montarCards(registros)
                    })
                } else {
                    console.log("Erro ao buscar os registros")
                }
            })
            .catch(function (erro) {
                console.log(erro)
            })
    }

    let categoriaAtual = 0

    function filtrar(idCategoria, botao) {
        categoriaAtual = idCategoria

        let botoes = document.getElementsByClassName("botao-filtro")
        for (let i = 0; i < botoes.length; i++) {
            botoes[i].classList.remove("filtro-ativo")
        }
        botao.classList.add("filtro-ativo") 

        let url = `/registros/listar/${sessionStorage.ID_USUARIO}`
        if (idCategoria != 0) {
            url = `/registros/listar/${sessionStorage.ID_USUARIO}/${idCategoria}`
        }

        fetch(url)
            .then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (registros) {
                        montarCards(registros)
                    })
                }
            })
            .catch(function (erro) {
                console.log(erro)
            })
    }

    function montarCards(registros) {
        if (registros.length == 0) {
            if (categoriaAtual == 0) {
                titulo_vazio.innerHTML = "Nenhuma postagem feita ainda"
                texto_vazio.innerHTML = "Que tal guardar o seu primeiro momento na natureza?"
            } else {
                titulo_vazio.innerHTML = "Nenhum registro nessa categoria"
                texto_vazio.innerHTML = "Escolha outra categoria ou registre um novo momento."
            }
            diario_vazio.style.display = "flex"
            lista_registros.innerHTML = ""
        } else {
            diario_vazio.style.display = "none"
            lista_registros.innerHTML = ""

            for (let i = 0; i < registros.length; i++) {
                let registro = registros[i]

                let foto = ""
                if (registro.capa != null) {
                    foto = `<img src="../${registro.capa}">`
                }

                lista_registros.innerHTML += `
                <div class="card-registro">
                    <div class="card-foto">${foto}</div>
                    <div class="card-conteudo">
                        <span class="card-meta">${registro.local} · ${registro.data}</span>
                        <h3>${registro.titulo}</h3>
                        <p>${registro.descricao}</p>
                        <div class="card-chips">
                            <span class="chip-humor">Humor ${registro.humorAntes} → ${registro.humorDepois}</span>
                            <span class="chip-clima">${registro.clima}</span>
                        </div>
                    </div>
                </div>
            `
            }
        }
    }

    listarRegistros()
</script>
